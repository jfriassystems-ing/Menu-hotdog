<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login | D'Ambiorix</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@700;800&display=swap" rel="stylesheet" />
  
  <!-- Nota: Usamos ../ porque estamos dentro de la carpeta /admin/ -->
  <link rel="stylesheet" href="../assets/css/main.css" />
  <link rel="stylesheet" href="../assets/css/admin.css" />
  <link rel="icon" href="../assets/images/logo.jpeg" type="image/jpeg" />
</head>
<body class="login-body">

  <div class="login-container">
    <img src="../assets/images/logo.jpeg" alt="Logo" class="login-logo" />
    <h1 class="login-title">Panel Admin</h1>
    <p class="login-subtitle">Ingresa tus credenciales para gestionar el menú</p>

    <form id="login-form" class="login-form">
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" required placeholder="admin@dambiorix.com" />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" required placeholder="••••••••" />
      </div>

      <div id="login-error" class="login-error" hidden>
        Credenciales incorrectas. Intenta de nuevo.
      </div>

      <button type="submit" id="login-btn" class="btn-gold">
        Iniciar Sesión
      </button>
    </form>
  </div>

  <!-- Cargamos el script de autenticación -->
  <script type="module" src="../assets/js/auth.js"></script>
</body>
</html>
